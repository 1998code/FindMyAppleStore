<body>
    <div class="topbar">
        <span class="topbar-title">
            Find My: Convenience Store
            <span class="version-badge">2.1</span>
        </span>
        <span class="topbar-subtitle">Powered by Apple MapKit JS</span>
        <div class="topbar-controls">
            <select class="region-select" id="regionSelect" onchange="changeRegion()">
                <option value="hong-kong" selected>Hong Kong</option>
                <option value="japan">Tokyo</option>
            </select>
            <select class="store-type-select" id="storeTypeSelect">
                <option value="7-Eleven">7-Eleven</option>
                <option value="Circle K">Circle K</option>
            </select>
            <select class="theme-select" id="themeSelect" onchange="changeTheme()">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <button type="button" class="search-btn" onclick="mapSearch()">
                <i class="fas fa-search"></i>
                Search
            </button>
            <button type="button" class="reset-btn hidden" id="resetBtn" onclick="resetMap()">
                <i class="fas fa-undo"></i>
                Reset
            </button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header hidden">
                <h3>Records</h3>
                <div>
                    <button type="button" class="maps-btn hidden" id="mapsBtn" onclick="openInMaps()">
                        Open in Maps
                        <i class="fa fa-map-pin"></i>
                    </button>
                </div>
            </div>
            <input type="text" class="search-field" id="searchField" placeholder="Search stores..." oninput="filterStores()" />
            <div id="store-list">
                <div class="no-data-container">
                    <i class="fas fa-search no-data-icon"></i>
                    <p class="no-data-text">Click "Search" to find convenience stores</p>
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script>
        // Replace your token (https://maps.developer.apple.com/token-maker)
        const tokenID = "eyJraWQiOiJGTlpRNTlXQVdSIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiI5UEFITFRHOEFEIiwiaWF0IjoxNzUzNzU5NzkzLCJvcmlnaW4iOiJmaW5kbXlzdG9yZS52ZXJjZWwuYXBwIn0.mlO4HGnkLtW4luYKENSzUS_ahA4oiZFNgKc59npOQ_oQR8JeDlgyvzRPPuHCX2gJElNgT2MPAqrhWBlWdUdgYw";

        mapkit.init({
            authorizationCallback: function(done) {
                done(tokenID);
            }
        });

        var map = new mapkit.Map("map", {
            colorScheme: getThemeColorScheme()
        });
        // Set initial Hong Kong region instead of world
        map.region = new mapkit.CoordinateRegion(
            new mapkit.Coordinate(22.3193, 114.1694),
            new mapkit.CoordinateSpan(0.5, 0.8)
        );

        var allStores = []; // Store all search results for filtering

        function getThemeColorScheme() {
            var themeSelect = document.getElementById('themeSelect');
            if (!themeSelect) return window.matchMedia('(prefers-color-scheme: dark)').matches ? mapkit.Map.ColorSchemes.Dark : mapkit.Map.ColorSchemes.Light;
            
            var selectedTheme = themeSelect.value;
            switch(selectedTheme) {
                case 'light':
                    return mapkit.Map.ColorSchemes.Light;
                case 'dark':
                    return mapkit.Map.ColorSchemes.Dark;
                default:
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? mapkit.Map.ColorSchemes.Dark : mapkit.Map.ColorSchemes.Light;
            }
        }

        function applyTheme(theme) {
            var isDark = false;
            
            switch(theme) {
                case 'light':
                    isDark = false;
                    break;
                case 'dark':
                    isDark = true;
                    break;
                default:
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            
            // Apply theme to body
            if (isDark) {
                document.body.setAttribute('data-theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
            }
            
            // Update map color scheme
            map.colorScheme = isDark ? mapkit.Map.ColorSchemes.Dark : mapkit.Map.ColorSchemes.Light;
        }
        
        function updateStoreTypeOptions(region) {
            var storeTypeSelect = document.getElementById('storeTypeSelect');
            
            if (region === "japan") {
                // Tokyo options
                storeTypeSelect.innerHTML = `
                    <option value="7-Eleven">7-Eleven</option>
                    <option value="FamilyMart">FamilyMart</option>
                    <option value="Lawson">Lawson</option>
                `;
            } else {
                // Hong Kong options
                storeTypeSelect.innerHTML = `
                    <option value="7-Eleven">7-Eleven</option>
                    <option value="Circle K">Circle K</option>
                `;
            }
        }

        function changeTheme() {
            var themeSelect = document.getElementById('themeSelect');
            applyTheme(themeSelect.value);
        }

        // Listen for color scheme changes (only when system theme is selected)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            var themeSelect = document.getElementById('themeSelect');
            if (themeSelect.value === 'system') {
                applyTheme('system');
            }
        });

        function changeRegion() {
            var select = document.getElementById('regionSelect');
            var selectedRegion = select.value;
            
            // Update store type options based on region
            updateStoreTypeOptions(selectedRegion);
            
            switch(selectedRegion) {
                case 'us':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(39.8283, -98.5795),
                        new mapkit.CoordinateSpan(25, 50)
                    );
                    break;
                case 'canada':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(56.1304, -106.3468),
                        new mapkit.CoordinateSpan(25, 70)
                    );
                    break;
                case 'mexico':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(23.6345, -102.5528),
                        new mapkit.CoordinateSpan(15, 25)
                    );
                    break;
                case 'europe':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(54.5260, 15.2551),
                        new mapkit.CoordinateSpan(30, 40)
                    );
                    break;
                case 'uk':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(55.3781, -3.4360),
                        new mapkit.CoordinateSpan(8, 10)
                    );
                    break;
                case 'asia':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(34.0479, 100.6197),
                        new mapkit.CoordinateSpan(40, 60)
                    );
                    break;
                case 'japan':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(35.6762, 139.6503),
                        new mapkit.CoordinateSpan(0.8, 1.2)
                    );
                    break;
                case 'hong-kong':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(22.3193, 114.1694),
                        new mapkit.CoordinateSpan(0.5, 0.8)
                    );
                    break;
                case 'india':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(20.5937, 78.9629),
                        new mapkit.CoordinateSpan(20, 25)
                    );
                    break;
                case 'australia':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(-25.2744, 133.7751),
                        new mapkit.CoordinateSpan(25, 35)
                    );
                    break;
                case 'middle-east':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(29.2985, 42.5510),
                        new mapkit.CoordinateSpan(20, 30)
                    );
                    break;
                case 'africa':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(-8.7832, 34.5085),
                        new mapkit.CoordinateSpan(50, 60)
                    );
                    break;
                case 'south-america':
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(-8.7832, -55.4915),
                        new mapkit.CoordinateSpan(40, 50)
                    );
                    break;
                default:
                    map.region = new mapkit.CoordinateRegion(
                        new mapkit.Coordinate(39.8283, -98.5795),
                        new mapkit.CoordinateSpan(25, 50)
                    );
            }
        }

        function showSkeletonItems() {
            var storeList = document.getElementById('store-list');
            storeList.innerHTML = '';
            
            for (var i = 0; i < 5; i++) {
                var skeletonItem = document.createElement('div');
                skeletonItem.className = 'skeleton-item';
                skeletonItem.innerHTML = `
                    <div class="skeleton-name"></div>
                    <div class="skeleton-address"></div>
                `;
                storeList.appendChild(skeletonItem);
            }
        }
        
        function toggleSearchField(show) {
            var searchField = document.getElementById('searchField');
            if (show) {
                searchField.classList.add('show');
            } else {
                searchField.classList.remove('show');
                searchField.value = '';
            }
        }
        
        function toggleMapsButton(show) {
            var mapsBtn = document.getElementById('mapsBtn');
            if (show) {
                mapsBtn.classList.remove('hidden');
            } else {
                mapsBtn.classList.add('hidden');
            }
        }
        
        function toggleResetButton(show) {
            var resetBtn = document.getElementById('resetBtn');
            if (show) {
                resetBtn.classList.remove('hidden');
            } else {
                resetBtn.classList.add('hidden');
            }
        }
        
        function toggleSidebarHeader(show) {
            var sidebarHeader = document.querySelector('.sidebar-header');
            if (show) {
                sidebarHeader.classList.remove('hidden');
            } else {
                sidebarHeader.classList.add('hidden');
            }
        }
        
        function resetMap() {
            // Clear annotations and stores
            map.removeAnnotations(map.annotations);
            allStores = [];
            
            // Reset map to Hong Kong region instead of world
            map.region = new mapkit.CoordinateRegion(
                new mapkit.Coordinate(22.3193, 114.1694),
                new mapkit.CoordinateSpan(0.5, 0.8)
            );
            
            // Reset region selector to Hong Kong
            document.getElementById('regionSelect').value = 'hong-kong';
            
            // Hide search field, maps button, reset button, and sidebar header
            toggleSearchField(false);
            toggleMapsButton(false);
            toggleResetButton(false);
            toggleSidebarHeader(false);
            
            // Reset store list
            document.getElementById('store-list').innerHTML = `
                <div class="no-data-container">
                    <i class="fas fa-search no-data-icon"></i>
                    <p class="no-data-text">Click "Search" to find convenience stores</p>
                </div>
            `;
        }

        function filterStores() {
            var searchTerm = document.getElementById('searchField').value.toLowerCase();
            var storeList = document.getElementById('store-list');
            storeList.innerHTML = '';
            
            var filteredStores = allStores.filter(function(store) {
                return store.name.toLowerCase().includes(searchTerm) || 
                       store.formattedAddress.toLowerCase().includes(searchTerm);
            });
            
            if (filteredStores.length === 0 && searchTerm !== '') {
                storeList.innerHTML = `
                    <div class="no-data-container">
                        <i class="fas fa-search-minus no-data-icon"></i>
                        <p class="no-data-text">No stores found matching your search.</p>
                    </div>
                `;
                return;
            }
            
            if (filteredStores.length === 0 && searchTerm === '') {
                filteredStores = allStores;
            }
            
            filteredStores.forEach(function(place, index) {
                var storeItem = document.createElement('div');
                storeItem.className = 'store-item';
                
                // Get the selected store type to determine color
                var storeTypeSelect = document.getElementById('storeTypeSelect');
                var selectedStoreType = storeTypeSelect ? storeTypeSelect.value : "7-Eleven";
                var iconColor;
                var separatorColor;
                
                if (selectedStoreType === "Circle K") {
                    iconColor = "#ff3b30"; // Red
                    separatorColor = "#ff3b30";
                } else if (selectedStoreType === "FamilyMart") {
                    iconColor = "#5ac8fa"; // Light blue
                    separatorColor = "#5ac8fa";
                } else if (selectedStoreType === "Lawson") {
                    iconColor = "#007aff"; // Deep blue
                    separatorColor = "#007aff";
                } else {
                    iconColor = "#34c759"; // Green (7-Eleven)
                    separatorColor = "#34c759";
                }
                
                storeItem.innerHTML = `
                    <div class="store-icon" style="background-color: ${iconColor};">
                        <i class="fas fa-store"></i>
                    </div>
                    <div class="store-content">
                        <div class="store-name" style="--separator-color: ${separatorColor};">${place.name}</div>
                        <div class="store-address">${place.formattedAddress}</div>
                    </div>
                `;
                
                storeItem.addEventListener('click', function() {
                    map.setCenterAnimated(place.coordinate, true);
                    var originalIndex = allStores.indexOf(place);
                    if (originalIndex !== -1) {
                        map.annotations[originalIndex].selected = true;
                    }
                });
                
                storeList.appendChild(storeItem);
            });
        }

        function mapSearch() {
            var search = new mapkit.Search({ region: map.region });
            
            // Show skeleton loading
            showSkeletonItems();
            toggleSearchField(false);
            toggleMapsButton(false);
            toggleSidebarHeader(false);
            
            // Get the selected store type for better results
            var storeTypeSelect = document.getElementById('storeTypeSelect');
            var searchTerm = storeTypeSelect ? storeTypeSelect.value : "7-Eleven";
            
            // For 7-Eleven searches, use region-appropriate terms
            if (searchTerm === "7-Eleven") {
                var regionSelect = document.getElementById('regionSelect');
                var selectedRegion = regionSelect ? regionSelect.value : "hong-kong";
                if (selectedRegion === "japan") {
                    searchTerm = "セブン-イレブン";
                } else {
                    searchTerm = "7-Eleven";
                }
            }
            // For Circle K searches
            if (searchTerm === "Circle K") {
                searchTerm = "Circle K";
            }
            // For FamilyMart searches
            if (searchTerm === "FamilyMart") {
                searchTerm = "ファミリーマート";
            }
            // For Lawson searches
            if (searchTerm === "Lawson") {
                searchTerm = "ローソン";
            }
            // For Japanese convenience store searches
            if (searchTerm === "コンビニ") {
                searchTerm = "コンビニ";
            }
            
            search.search(searchTerm, function(error, data) {
                if (error) {
                    // Handle search error
                    alert("Error occur! Please try again later.");
                    document.getElementById('store-list').innerHTML = `
                        <div class="no-data-container">
                            <i class="fas fa-search no-data-icon"></i>
                            <p class="no-data-text">Click "Search" to find convenience stores</p>
                        </div>
                    `;
                    toggleSearchField(false);
                    toggleMapsButton(false);
                    toggleSidebarHeader(false);
                    return;
                }
                
                // Clear existing annotations
                map.removeAnnotations(map.annotations);
                
                // Check if we have any results
                if (!data.places || data.places.length === 0) {
                    // Try fallback search for 7-Eleven (Japan)
                    if (searchTerm === "セブン-イレブン") {
                        search.search("ファミリーマート", function(error2, data2) {
                            if (!error2 && data2.places && data2.places.length > 0) {
                                processSearchResults(data2);
                            } else {
                                showNoResults();
                            }
                        });
                        return;
                    }
                    // Try fallback search for 7-Eleven (Hong Kong)
                    if (searchTerm === "7-Eleven store") {
                        search.search("Circle K store", function(error2, data2) {
                            if (!error2 && data2.places && data2.places.length > 0) {
                                processSearchResults(data2);
                            } else {
                                showNoResults();
                            }
                        });
                        return;
                    }
                    // Try fallback search for FamilyMart
                    if (searchTerm === "ファミリーマート") {
                        search.search("ローソン", function(error2, data2) {
                            if (!error2 && data2.places && data2.places.length > 0) {
                                processSearchResults(data2);
                            } else {
                                showNoResults();
                            }
                        });
                        return;
                    }
                    showNoResults();
                    return;
                }
                
                // If we have very few results for 7-Eleven (Japan), try FamilyMart
                if (data.places.length < 3 && searchTerm === "セブン-イレブン") {
                    search.search("ファミリーマート", function(error2, data2) {
                        if (!error2 && data2.places && data2.places.length > data.places.length) {
                            processSearchResults(data2);
                        } else {
                            processSearchResults(data);
                        }
                    });
                    return;
                }
                // If we have very few results for 7-Eleven (Hong Kong), try Circle K
                if (data.places.length < 3 && searchTerm === "7-Eleven store") {
                    search.search("Circle K store", function(error2, data2) {
                        if (!error2 && data2.places && data2.places.length > data.places.length) {
                            processSearchResults(data2);
                        } else {
                            processSearchResults(data);
                        }
                    });
                    return;
                }
                // If we have very few results for FamilyMart, try Lawson
                if (data.places.length < 3 && searchTerm === "ファミリーマート") {
                    search.search("ローソン", function(error2, data2) {
                        if (!error2 && data2.places && data2.places.length > data.places.length) {
                            processSearchResults(data2);
                        } else {
                            processSearchResults(data);
                        }
                    });
                    return;
                }
                
                processSearchResults(data);
            });
            
            function showNoResults() {
                document.getElementById('store-list').innerHTML = `
                    <div class="no-data-container">
                        <i class="fas fa-store-slash no-data-icon"></i>
                        <p class="no-data-text">No convenience stores found in this region.</p>
                    </div>
                `;
                toggleSearchField(false);
                toggleMapsButton(false);
                toggleSidebarHeader(false);
                allStores = [];
            }
            
            function processSearchResults(data) {
                
                var annotations = data.places.map(function(place) {
                    var annotation = new mapkit.MarkerAnnotation(place.coordinate);
                    annotation.title = place.name;
                    annotation.subtitle = place.formattedAddress;
                    // Use different colors based on store type
                    var storeTypeSelect = document.getElementById('storeTypeSelect');
                    var selectedStoreType = storeTypeSelect ? storeTypeSelect.value : "7-Eleven";
                    var annotationColor;
                    
                    if (selectedStoreType === "Circle K") {
                        annotationColor = "#ff3b30"; // Red
                    } else if (selectedStoreType === "FamilyMart") {
                        annotationColor = "#5ac8fa"; // Light blue
                    } else if (selectedStoreType === "Lawson") {
                        annotationColor = "#007aff"; // Deep blue
                    } else {
                        annotationColor = "#34c759"; // Green (7-Eleven)
                    }
                    
                    annotation.color = annotationColor;
                    return annotation;
                });
                
                map.showItems(annotations);
                
                // Store all results for filtering
                allStores = data.places;
                
                // Show search field, maps button, reset button, and sidebar header if we have results
                toggleSearchField(data.places.length > 0);
                toggleMapsButton(data.places.length > 0);
                toggleResetButton(data.places.length > 0);
                toggleSidebarHeader(data.places.length > 0);
                
                // Populate sidebar with store list
                filterStores();
            }
        }

        function changeLanguage() {
            var languageSelect = document.getElementById('languageSelect');
            var selectedLanguage = languageSelect.value;
            
            // Update map language - MapKit JS does support this
            map.language = selectedLanguage;
            
            // Re-search to get results in new language if stores are already loaded
            if (allStores.length > 0) {
                mapSearch();
            }
        }

        function openInMaps() {
            // Get the current map region bounds
            var region = map.region;
            var center = region.center;
            var span = region.span;
            
            // Calculate approximate bounds
            var north = center.latitude + (span.latitudeDelta / 2);
            var south = center.latitude - (span.latitudeDelta / 2);
            var east = center.longitude + (span.longitudeDelta / 2);
            var west = center.longitude - (span.longitudeDelta / 2);
            
            // Create Apple Maps URL with search for convenience stores in the current region
            var storeTypeSelect = document.getElementById('storeTypeSelect');
            var searchTerm = storeTypeSelect ? storeTypeSelect.value : "7-Eleven";
            var mapsUrl = `https://maps.apple.com/?q=${encodeURIComponent(searchTerm)}&ll=${center.latitude},${center.longitude}&spn=${span.longitudeDelta},${span.longitudeDelta}`;
            
            // Open in new tab/window
            window.open(mapsUrl, '_blank');
        }
    </script>
</body>
</html>
